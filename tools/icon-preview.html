    width: 100%;
    letter-spacing: 0.2px;

  small.note {
    color: #71717a;
    font-size: 11px;
    display: block;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>

<div class="row" id="designs"></div>

<script>

  {
    name: "Dark + Coral",
    desc: "Editorial dark background with a coral chameleon. Matches the in-app aesthetic, looks 'pro tool' on the home screen.",
    svg: () => `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  },
  {

      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
        <rect width="1024" height="1024" fill="#FD696A"/>
        <g transform="translate(112, 80) scale(8.33)">

  },
  {
    name: "Color shift",
    desc: "Pink-to-teal diagonal gradient with a white chameleon. Visualises the app concept directly — change captured.",
    svg: () => `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FF6EA4"/>
            <stop offset="1" stop-color="#4DD2BD"/>
          </linearGradient>
        </defs>
        <rect width="1024" height="1024" fill="url(#g)"/>
        <g transform="translate(112, 80) scale(8.33)">
          <path d="${BODY_PATH}" fill="#fafafa"/>
          <path d="${TAIL_PATH}" fill="#fafafa"/>

    `,
  },
  {
    name: "Wave split (signature)",
    desc: "Dark bg with a chameleon that's pink on top, teal below, wavy boundary — captures the onboarding animation as a still.",
    svg: () => `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
        <defs>
          <clipPath id="topHalf">
            <path d="M 0 0 L 1024 0 L 1024 480
              C 920 540, 800 420, 680 500
              C 560 580, 440 420, 320 500
              C 200 580, 100 460, 0 540 Z"/>
          </clipPath>

        <rect width="1024" height="1024" fill="#0c0c0e"/>
        <g transform="translate(112, 80) scale(8.33)">
          <path d="${BODY_PATH}" fill="#4DD2BD"/>
          <path d="${TAIL_PATH}" fill="#4DD2BD"/>
        </g>
        <g transform="translate(112, 80) scale(8.33)" clip-path="url(#topHalf)" style="transform-box: fill-box;">
          <path d="${BODY_PATH}" fill="#FF6EA4"/>
          <path d="${TAIL_PATH}" fill="#FF6EA4"/>
        </g>

function makeCard(d, i) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="preview" id="prev-${i}"></div>
    <h3>${d.name}</h3>
    <p>${d.desc}</p>
    <button data-i="${i}">Download 1024×1024 PNG</button>
    <small class="note">Save as <code>assets/icon.png</code></small>
  `;
  card.querySelector('.preview').innerHTML = d.svg();
  card.querySelector('.preview svg').setAttribute('width', '240');
  card.querySelector('.preview svg').setAttribute('height', '240');
  card.querySelector('button').addEventListener('click', () => download(i));
  return card;
}

async function download(i) {
  const svg = designs[i].svg();
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.crossOrigin = "anonymous";
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = url;
  });
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, 1024, 1024);
  URL.revokeObjectURL(url);
  canvas.toBlob((b) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `trace-icon-${designs[i].name.toLowerCase().replace(/\s+/g, '-')}.png`;
    a.click();
  }, 'image/png');
}

const root = document.getElementById('designs');
designs.forEach((d, i) => root.appendChild(makeCard(d, i)));
